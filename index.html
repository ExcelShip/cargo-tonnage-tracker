<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Cargo Tracker Debug</title>
<style>
body{font-family:monospace;background:#0d0f12;color:#e8eaf0;padding:16px;font-size:12px;}
button{background:#3b82f6;color:#fff;border:none;padding:8px 16px;border-radius:6px;cursor:pointer;margin:4px;font-size:13px;}
.row{padding:3px 0;border-bottom:1px solid rgba(255,255,255,0.05);}
.ok{color:#10b981;} .err{color:#ef4444;} .warn{color:#f59e0b;}
pre{white-space:pre-wrap;word-break:break-all;background:#13161b;padding:10px;border-radius:6px;margin:8px 0;}
</style>
</head>
<body>
<h2>Cargo Tracker — Debug</h2>
<button onclick="runDebug()">Fetch & Inspect TONNAGE sheet</button>
<div id="out"></div>
<script>
const SHEET_ID = '16OVoXLebQY9g17gmeDDcFvn26my5WwEM_ds-WnOC1fg';
const GID = '1517312983';

async function runDebug() {
  const out = document.getElementById('out');
  out.innerHTML = '<p class="warn">Fetching...</p>';

  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${GID}`;
  out.innerHTML += `<p>URL: ${url}</p>`;

  try {
    const res = await fetch(url);
    out.innerHTML += `<p class="${res.ok?'ok':'err'}">Status: ${res.status} ${res.statusText}</p>`;
    if (!res.ok) { out.innerHTML += '<p class="err">Failed to fetch — sheet may not be public</p>'; return; }

    const text = await res.text();
    out.innerHTML += `<p class="ok">Got ${text.length} chars</p>`;
    out.innerHTML += `<p>First 500 chars:</p><pre>${escHtml(text.slice(0,500))}</pre>`;

    // Parse CSV
    const rows = parseCSV(text);
    out.innerHTML += `<p class="ok">Parsed ${rows.length} rows</p>`;
    out.innerHTML += `<p>First 10 rows:</p>`;
    rows.slice(0,10).forEach((row,i) => {
      out.innerHTML += `<div class="row"><b>[${i}]</b> ${row.slice(0,5).map(c=>`<span style="margin-right:12px">${escHtml(String(c??'null'))}</span>`).join('')}</div>`;
    });

    // Check for Vessel Name
    let found = -1;
    rows.forEach((row,i) => { if (String(row[0]||'').trim() === 'Vessel Name') found = i; });
    out.innerHTML += found>=0
      ? `<p class="ok">✓ Found "Vessel Name" at row ${found}</p>`
      : `<p class="err">✗ "Vessel Name" NOT found in column A</p>`;

    // Show all column A values
    out.innerHTML += `<p>All column A values:</p>`;
    rows.forEach((row,i) => {
      const v = String(row[0]||'').trim();
      if (v) out.innerHTML += `<div class="row">[${i}] <span class="${v.startsWith('MV')?'ok':v==='Vessel Name'?'warn':''}">${escHtml(v)}</span></div>`;
    });

  } catch(e) {
    out.innerHTML += `<p class="err">Error: ${e.message}</p>`;
  }
}

function escHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function parseCSV(text) {
  const rows=[];
  const lines=text.replace(/\r\n/g,'\n').replace(/\r/g,'\n').split('\n');
  for (const line of lines) {
    if (!line.trim()) continue;
    const cols=[];let cur='',inQ=false;
    for (let i=0;i<line.length;i++){
      const ch=line[i];
      if(ch==='"'){if(inQ&&line[i+1]==='"'){cur+='"';i++;}else inQ=!inQ;}
      else if(ch===','&&!inQ){cols.push(cur);cur='';}
      else cur+=ch;
    }
    cols.push(cur);
    rows.push(cols.map(c=>c.trim()===''?null:c.trim()));
  }
  return rows;
}
</script>
</body>
</html>
